version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agentbuilder-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentbuilder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentbuilder-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentbuilder
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      # 1. Tell the backend to accept requests from Mac's port 3001
      CORS_ORIGINS: http://localhost:3001 
    ports:
      # 2. Map Mac's port 8001 to Container's port 8000
      - "8001:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/vector_stores:/app/vector_stores
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentbuilder-frontend
    environment:
      # 3. Tell the frontend to send API requests to Mac's port 8001
      NEXT_PUBLIC_API_URL: http://localhost:8001
    ports:
      # 4. Map Mac's port 3001 to Container's port 3000
      - "3001:3000"
    depends_on:
      - backend
    # 5. CRITICAL: Tells Next.js to listen to Docker's network router
    command: npm run dev -- -H 0.0.0.0

# THIS FIXES THE "INVALID COMPOSE PROJECT" ERROR
volumes:
  postgres_data: