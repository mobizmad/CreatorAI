version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agentbuilder-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentbuilder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentbuilder-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentbuilder
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      # UPDATED: Added your public frontend URL to the allowed origins
      CORS_ORIGINS: "https://aicreate.ibechamp.com,http://localhost:3001"
    ports:
      - "8001:8001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/vector_stores:/app/vector_stores
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentbuilder-frontend
    environment:
      # UPDATED: Frontend now talks to the public Cloudflare backend URL
      NEXT_PUBLIC_API_URL: "https://aicreateback.ibechamp.com"
    ports:
      - "3001:3001"
    depends_on:
      - backend
    command: npm run dev -- -p 3001 -H 0.0.0.0

volumes:
  postgres_data: