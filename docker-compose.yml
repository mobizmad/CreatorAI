version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agentbuilder-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentbuilder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentbuilder-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentbuilder
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      # Tell the backend to accept requests from Host port 3001
      CORS_ORIGINS: http://localhost:3001 
    ports:
      # Symmetrical mapping: Host 8001 -> Container 8001
      - "8001:8001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/vector_stores:/app/vector_stores
    depends_on:
      postgres:
        condition: service_healthy
    # Start Uvicorn on port 8001 inside the container
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentbuilder-frontend
    environment:
      # Tell the frontend to send API requests to Host port 8001
      NEXT_PUBLIC_API_URL: http://localhost:8001
    ports:
      # Symmetrical mapping: Host 3001 -> Container 3001
      - "3001:3001"
    depends_on:
      - backend
    # Start Next.js on port 3001 inside the container
    command: npm run dev -- -p 3001 -H 0.0.0.0

volumes:
  postgres_data: