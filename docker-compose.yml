version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agentbuilder-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentbuilder
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentbuilder-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentbuilder
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FAL_KEY: ${FAL_KEY}
      OLLAMA_ENDPOINT: http://host.docker.internal:11434
      LOCAL_IMAGE_MODEL_ID: ${LOCAL_IMAGE_MODEL_ID:-stabilityai/stable-diffusion-3.5-medium}
      LOCAL_IMAGE_SERVICE_URL: ${LOCAL_IMAGE_SERVICE_URL:-http://host.docker.internal:8002}
      LOCAL_IMAGE_DEVICE: ${LOCAL_IMAGE_DEVICE:-auto}
      LOCAL_IMAGE_TORCH_DTYPE: ${LOCAL_IMAGE_TORCH_DTYPE:-auto}
      HF_HOME: /app/.cache/huggingface
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      PUBLIC_API_BASE_URL: "http://localhost:8001"
      CORS_ORIGINS: "https://aicreate.ibechamp.com,http://localhost:3001"
    ports:
      - "8001:8001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/vector_stores:/app/vector_stores
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentbuilder-frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8001"
    ports:
      - "3001:3001"
    depends_on:
      - backend
    command: npm run dev -- -p 3001 -H 0.0.0.0

volumes:
  postgres_data:
  huggingface_cache:
